name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag can be moved to
      # point at different code, a SHA cannot. Dependabot keeps the pins fresh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: no dependency gets to run code at install time.
        # Nothing in the tree needs a postinstall to build or test.
        run: npm ci --ignore-scripts

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Visual regression is a LOCAL gate, not a CI one.
  #
  # The baselines are gitignored: they are tens of megabytes of derived PNGs,
  # and they are platform-specific anyway, since font rasterisation differs
  # between macOS and Linux. Capture a baseline on the unmodified tree, make
  # the change, then diff:
  #
  #   npm run visual:baseline   # on a clean tree
  #   npm run visual            # after the change
  #
  # To make this a CI gate you would need a baseline the runner can trust —
  # either generated in the same pinned container on every run (which only
  # catches within-run nondeterminism, not regressions) or stored as a build
  # artifact keyed to a known-good commit.
