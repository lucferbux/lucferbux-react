[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Firebase client-side config is public by design — not secrets
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

# SPA: redirect all routes to index.html (React Router handles routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response. The Content-Security-Policy is not here:
# it is a <meta> tag that vite.config.ts injects at build time, so it governs
# the document only. As a header it would also bind /sw.js, and the service
# worker's runtime image cache fetches cross-origin images, which `connect-src`
# would then have to allow from anywhere. `frame-ancestors` cannot be set from a
# <meta> tag, so X-Frame-Options carries the anti-framing rule.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(self), camera=(), geolocation=(), gyroscope=(self), magnetometer=(self), microphone=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The admin is behind Firebase Auth, but there is no reason for it to be indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cache hashed assets immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache index.html or service worker
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
